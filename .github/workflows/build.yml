name: Build and publish images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: r-${{ matrix.package }} R ${{ matrix.r_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [survival, nanonext]
        r_version:
          - 4.5.3
          - 4.6.2
        include:
          - r_version: 4.5.3
            publish_floating_tags: false
          - r_version: 4.6.2
            publish_floating_tags: true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract R version tag
        id: r-version
        env:
          R_VERSION: ${{ matrix.r_version }}
        shell: bash
        run: echo "tag=${R_VERSION%%@*}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-${{ matrix.package }}
          tags: |
            type=raw,value=${{ steps.r-version.outputs.tag }}
            type=sha,prefix=,suffix=-${{ steps.r-version.outputs.tag }}
            type=raw,value=latest,enable=${{ matrix.publish_floating_tags }}
            type=sha,prefix=,enable=${{ matrix.publish_floating_tags }}

      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.package }}
          file: ${{ matrix.package }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: R_VERSION=${{ matrix.r_version }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=r-${{ matrix.package }}-${{ steps.r-version.outputs.tag }}
          cache-to: type=gha,mode=max,scope=r-${{ matrix.package }}-${{ steps.r-version.outputs.tag }}

      - name: Report image sizes
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/r-${{ matrix.package }}:${{ steps.r-version.outputs.tag }}
        shell: bash
        run: .github/scripts/report-image-sizes.sh
