name: Build and publish images

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: r-${{ matrix.package }} R ${{ matrix.r_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [survival, nanonext]
        r_version:
          - 4.5.3
          - 4.6.2
        include:
          - r_version: 4.5.3
            publish_floating_tags: false
          - r_version: 4.6.2
            publish_floating_tags: true

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/release'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract R version tag
        id: r-version
        env:
          R_VERSION: ${{ matrix.r_version }}
        shell: bash
        run: echo "tag=${R_VERSION%%@*}" >> "$GITHUB_OUTPUT"

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/r-${{ matrix.package }}
          tags: |
            type=raw,value=${{ steps.r-version.outputs.tag }}
            type=sha,prefix=,suffix=-${{ steps.r-version.outputs.tag }}
            type=raw,value=latest,enable=${{ matrix.publish_floating_tags }}
            type=sha,prefix=,enable=${{ matrix.publish_floating_tags }}

      - name: Build and publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.package }}
          file: ${{ matrix.package }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: R_VERSION=${{ matrix.r_version }}
          push: ${{ github.ref == 'refs/heads/release' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=r-${{ matrix.package }}-${{ steps.r-version.outputs.tag }}
          cache-to: type=gha,mode=max,scope=r-${{ matrix.package }}-${{ steps.r-version.outputs.tag }}

      - name: Report image sizes
        if: github.ref == 'refs/heads/release'
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/r-${{ matrix.package }}:${{ steps.r-version.outputs.tag }}
        shell: bash
        run: .github/scripts/report-image-sizes.sh
